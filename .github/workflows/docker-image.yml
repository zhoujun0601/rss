name: Build and Push Images

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: |
            ${{ github.event_name == 'release' && format('{0}/{1}:{2}', secrets.DOCKER_USERNAME, secrets.DOCKER_REPO, github.event.release.tag_name) || 'rssbot:development' }}
            ${{ github.event_name == 'release' && format('{0}/{1}:latest', secrets.DOCKER_USERNAME, secrets.DOCKER_REPO) || 'rssbot:latest' }}
          build-args: |
            VERSION=${{ github.event.release.tag_name || 'development' }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at || 'workflow' }}
