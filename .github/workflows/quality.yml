name: Rust Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RustBot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check

      - name: Run Clippy
        run: cargo +1.98.1 clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +1.98.1 test --all-targets

      - name: Build release binary
        run: cargo +1.98.1 build --release --locked
